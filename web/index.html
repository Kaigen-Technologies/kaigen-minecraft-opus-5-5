<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; background: #07080a; color: #f2f4f8; overflow: hidden; }
  body { font: 400 14px/1.5 ui-monospace, "SF Mono", Menlo, monospace; }
  #canvas { display: block; width: 100vw; height: 100vh; }

  /* Overlays the canvas rather than replacing it: the canvas must keep its
     real size from the first frame or the swapchain is created 0x0. */
  #status {
    position: fixed;
    inset: 0;
    z-index: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 14px;
    text-align: center;
    padding: 24px;
    background: #07080a;
  }

  #status[hidden] { display: none; }

  .spark {
    width: 9px;
    height: 9px;
    background: #E551BA;
    animation: pulse 1.4s ease-in-out infinite;
  }

  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .25; } }

  .msg { color: #8a91a1; letter-spacing: .04em; max-width: 420px; text-wrap: pretty; }
  .msg strong { color: #f2f4f8; font-weight: 600; display: block; margin-bottom: 6px; }
  .msg a { color: #E551BA; }

  @media (prefers-reduced-motion: reduce) { .spark { animation: none; } }

  /* "Made with Kaigen": a real link over the canvas; the game's input listeners sit on the canvas, not here */
  #kaigen {
    position: fixed;
    top: max(12px, env(safe-area-inset-top));
    right: max(12px, env(safe-area-inset-right));
    z-index: 2;
    display: flex;
    align-items: center;
    gap: 10px;
    height: 44px;
    padding: 4px 16px 4px 4px;
    border-radius: 999px;
    background: rgba(10, 12, 16, .72);
    border: 1px solid rgba(255, 255, 255, .14);
    -webkit-backdrop-filter: blur(10px);
    backdrop-filter: blur(10px);
    color: #f2f4f8;
    font: 500 13px/1 ui-monospace, "SF Mono", Menlo, monospace;
    letter-spacing: .02em;
    text-decoration: none;
    transition: opacity .25s ease, border-color .2s ease, background .2s ease, box-shadow .2s ease;
  }
  #kaigen:hover, #kaigen:focus-visible {
    background: rgba(18, 20, 28, .86);
    border-color: rgba(229, 81, 186, .7);
    box-shadow: 0 0 22px rgba(229, 81, 186, .35);
    outline: none;
  }
  #kaigen .mark {
    width: 34px;
    height: 34px;
    border-radius: 50%;
    display: grid;
    place-items: center;
    background: radial-gradient(circle at 30% 25%, #2a1f3d, #120f1a 70%);
    box-shadow: inset 0 0 0 1px rgba(229, 81, 186, .45);
  }
  #kaigen .mark img { width: 20px; height: 20px; display: block; }
  #kaigen b { color: #E551BA; font-weight: 700; }
  #kaigen .arrow { opacity: .7; }
  /* in play the pointer is locked, so the link cannot be clicked: step back until the game pauses */
  #kaigen.playing { opacity: .45; }
  /* phones: the icon alone, the corner is shared with the game's Menu button */
  @media (pointer: coarse), (max-width: 720px) {
    #kaigen { padding: 4px; gap: 0; }
    #kaigen .label { display: none; }
  }

<div id="status"><div class="spark"></div><p class="msg">Loading the engine…</p></div>

<script type="module">
  const canvas = document.getElementById("canvas");
  const kaigen = document.getElementById("kaigen");
  document.addEventListener("pointerlockchange", () =>
    kaigen.classList.toggle("playing", document.pointerLockElement !== null));
  const status = document.getElementById("status");

  const show = (html) => { status.innerHTML = `<p class="msg">${html}</p>`; status.hidden = false; };

  // Mobile ALWAYS gets the single-threaded wasm-ios build: threads are not reliable on
  // phones even where the browser offers SharedArrayBuffer. Same test as the engine's
  // os_is_mobile (src/os/wasm/main.ts). Desktop threads need cross-origin isolation.
  // Bumped every publish so immutable assets can never be served stale.
  const VERSION = "__VERSION__";

  // ?profile=mt|st forces one, for testing the other path on this machine.
  const forced = new URLSearchParams(location.search).get("profile");
  const mobile =
    (navigator.userAgentData?.mobile ?? false) ||
    (navigator.maxTouchPoints > 0 && matchMedia("(pointer: coarse)").matches) ||
    /Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent);
  const threaded = !mobile && self.crossOriginIsolated && typeof SharedArrayBuffer !== "undefined";
  const pick = forced === "mt" || forced === "st" ? forced : threaded ? "mt" : "st";
  const dir = `./${VERSION}/${pick}/`;

  if (!navigator.gpu) {
    show(`<strong>This demo needs WebGPU.</strong>Try the latest Chrome, Edge or Safari. On iPhone it needs iOS 18 or newer.`);
  } else {
    try {
      const { createGame } = await import(dir + "main.js");
      const game = createGame({
        canvas,
        // Same-origin, resolved from the page so this works on any host.
        // Cooked assets are served by the Worker out of R2 and edge-cached for a
        // year, under a hash of their content so a re-cook is never served stale.
        baseUrl: new URL("./__ASSETS__/", location.href).href,
        // Brotli-11, served verbatim with Content-Encoding: br by the site
        // Worker; fetch decodes it natively.
        // Absolute, because the worker resolves this against its own location,
        // not the page — a relative "./mt/..." becomes "/mt/mt/...".
        wasmUrl: new URL(dir + "game.wasm.br", location.href).href,
      });

      game.oncrash = (m) => show(`<strong>The demo crashed.</strong>${m ?? ""}`);

      await game.ready;
      status.hidden = true;
    } catch (err) {
      show(`<strong>Couldn't start the demo.</strong>${String(err && err.message || err)}`);
    }
  }
</script>
